[package]
name = "browserd"
version = "0.1.0"
edition = "2021"
description = "CDP daemon for the opencode-browser plugin"
publish = false

[[bin]]
name = "browserd"
path = "src/main.rs"

[dependencies]
tokio = { version = "1", features = ["full"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
futures-util = "0.3"
clap = { version = "4", features = ["derive"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
anyhow = "1"
base64 = "0.22"
thiserror = "2"
fs2 = "0.4"
libc = "0.2"
chromiumoxide = { package = "chromey", version = "=2.58.2" }
