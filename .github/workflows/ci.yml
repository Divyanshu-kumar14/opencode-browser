name: ci

on:
  push:
  pull_request:

jobs:
  rust:
    name: rust (fmt, clippy, test)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: daemon
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - run: cargo fmt --check
      - run: cargo clippy --all-targets -- -D warnings
      - run: cargo test

  shim:
    name: shim (typecheck, test)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: plugin
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile
      - run: ./node_modules/.bin/tsc --noEmit
      - run: bun test

  pack-smoke:
    name: pack smoke (build, pack, size budget)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: oven-sh/setup-bun@v2
      - run: node scripts/build-native.mjs
      - run: test -x prebuilds/linux-x64/browserd
      - run: mkdir -p /tmp/opencode-pack && npm pack --pack-destination /tmp/opencode-pack
      - run: |
          TARBALL=$(ls /tmp/opencode-pack/*.tgz)
          SIZE=$(stat -c%s "$TARBALL")
          echo "tarball: $TARBALL ($SIZE bytes)"
          test "$SIZE" -le 20971520 || { echo "error: packed tarball exceeds the 20 MB budget"; exit 1; }
          tar tzf "$TARBALL" | grep -E "^(package/plugin/src/index\.ts|package/prebuilds/linux-x64/browserd|package/README\.md)$"

  e2e:
    name: e2e (daemon smoke against the fixture)
    runs-on: ubuntu-latest
    needs: [rust, shim, pack-smoke]
    env:
      CHROME_NO_SANDBOX: "1"
      XDG_RUNTIME_DIR: /tmp/xdg-runtime
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - run: google-chrome --version || chromium --version
      - run: cargo build --manifest-path daemon/Cargo.toml
      # Deterministic end-to-end: real daemon + real Chrome + fixture server,
      # 61 checks. (The old `opencode run` probe was agent-driven and flaky:
      # the agent explored instead of calling the tool, then died on an
      # auto-rejected /tmp permission — never a product failure.)
      - run: |
          mkdir -p "$XDG_RUNTIME_DIR"
          ./daemon/target/debug/browserd &
          echo $! > /tmp/browserd.pid
          for i in $(seq 1 50); do
            [ -S "$XDG_RUNTIME_DIR/opencode-browser/v1/daemon.sock" ] && break
            sleep 0.2
          done
          [ -S "$XDG_RUNTIME_DIR/opencode-browser/v1/daemon.sock" ]
          node scripts/smoke.mjs
      - run: kill "$(cat /tmp/browserd.pid)" || true
        if: always()
