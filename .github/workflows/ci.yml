name: ci

on:
  push:
  pull_request:

jobs:
  rust:
    name: rust (fmt, clippy, test)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: daemon
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - run: cargo fmt --check
      - run: cargo clippy --all-targets -- -D warnings
      - run: cargo test

  shim:
    name: shim (typecheck, test)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: plugin
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile
      - run: ./node_modules/.bin/tsc --noEmit
      - run: bun test

  pack-smoke:
    name: pack smoke (build, pack, size budget)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: oven-sh/setup-bun@v2
      - run: node scripts/build-native.mjs
      - run: test -x prebuilds/linux-x64/browserd
      - run: mkdir -p /tmp/opencode-pack && npm pack --pack-destination /tmp/opencode-pack
      - run: |
          TARBALL=$(ls /tmp/opencode-pack/*.tgz)
          SIZE=$(stat -c%s "$TARBALL")
          echo "tarball: $TARBALL ($SIZE bytes)"
          test "$SIZE" -le 20971520 || { echo "error: packed tarball exceeds the 20 MB budget"; exit 1; }
          tar tzf "$TARBALL" | grep -E "^(package/plugin/src/index\.ts|package/prebuilds/linux-x64/browserd|package/README\.md)$"

  e2e:
    name: e2e (opencode run against the fixture)
    runs-on: ubuntu-latest
    needs: [rust, shim, pack-smoke]
    env:
      CHROME_NO_SANDBOX: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - run: google-chrome --version || chromium --version
      - run: npm install -g opencode-ai@latest
      - run: opencode --version
      # Smoke probe: browse_ping is the Phase 0 conformance tool (debug-gated).
      # If the tool surface changes, point this at the current stable smoke tool instead.
      - run: |
          printf '{"$schema":"https://opencode.ai/config.json","plugins":["./plugin"]}' > opencode.jsonc
          opencode run "call browse_ping with value ci and report the exact output" 2>&1 | tee e2e.log
          grep -q "pong:ci" e2e.log
        env:
          OPENCODE_BROWSER_DEBUG: "1"
