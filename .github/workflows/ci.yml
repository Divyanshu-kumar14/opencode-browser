name: ci

on:
  push:
  pull_request:

jobs:
  rust:
    name: rust (fmt, clippy, test)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: daemon
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - run: cargo fmt --check
      - run: cargo clippy --all-targets -- -D warnings
      - run: cargo test

  engine:
    name: engine (typecheck, unit + real-Chromium e2e)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: plugin
    env:
      # Fail instead of silently skipping when Chromium cannot launch.
      OPENCODE_BROWSER_E2E: "1"
      OPENCODE_BROWSER_NO_SANDBOX: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - run: google-chrome --version || chromium --version
      - run: bun install
      - run: ./node_modules/.bin/tsc --noEmit
      - run: bun run test

  legacy:
    name: legacy shim (quarantined tests)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: plugin
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - run: bun install
      - run: bun run test:legacy

  pack-smoke:
    name: pack smoke (content, size budget)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - run: mkdir -p /tmp/opencode-pack && npm pack --pack-destination /tmp/opencode-pack
      - run: |
          TARBALL=$(ls /tmp/opencode-pack/*.tgz)
          SIZE=$(stat -c%s "$TARBALL")
          echo "tarball: $TARBALL ($SIZE bytes)"
          test "$SIZE" -le 20971520 || { echo "error: packed tarball exceeds the 20 MB budget"; exit 1; }
          tar tzf "$TARBALL" | grep -E "^(package/plugin/src/index\.ts|package/README\.md)$"
          # The engine ships TypeScript only: no Rust daemon binary, no legacy shim.
          ! tar tzf "$TARBALL" | grep -E "prebuilds/|browserd|plugin/legacy"
      - name: install and import the packed entry
        run: |
          rm -rf /tmp/opencode-pack/extracted && mkdir -p /tmp/opencode-pack/extracted
          tar xzf /tmp/opencode-pack/*.tgz -C /tmp/opencode-pack/extracted
          cd /tmp/opencode-pack/extracted/package
          bun install --production
          bun -e "await import('./plugin/src/index.ts'); console.log('packed entry imported')"

  daemon-e2e:
    name: daemon (smoke against the fixture)
    runs-on: ubuntu-latest
    needs: [rust]
    env:
      XDG_RUNTIME_DIR: /tmp/xdg-runtime
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - run: google-chrome --version || chromium --version
      - run: cargo build --manifest-path daemon/Cargo.toml
      # Deterministic end-to-end: real daemon + real Chrome + fixture server,
      # 61 checks. (The old `opencode run` probe was agent-driven and flaky:
      # the agent explored instead of calling the tool, then died on an
      # auto-rejected /tmp permission — never a product failure.)
      - run: |
          mkdir -p "$XDG_RUNTIME_DIR"
          ./daemon/target/debug/browserd &
          echo $! > /tmp/browserd.pid
          for i in $(seq 1 50); do
            [ -S "$XDG_RUNTIME_DIR/opencode-browser/v1/daemon.sock" ] && break
            sleep 0.2
          done
          [ -S "$XDG_RUNTIME_DIR/opencode-browser/v1/daemon.sock" ]
          node scripts/smoke.mjs
      - run: kill "$(cat /tmp/browserd.pid)" || true
        if: always()
